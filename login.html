<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - RecruitPro</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #000000;
            --bg-surface: #0a0a0a;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --orange-primary: #ff6b35;
            --orange-secondary: #ff8c42;
            --orange-tertiary: #ff5722;
            --border-color: rgba(255, 107, 53, 0.2);
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .orange-splat {
            position: absolute;
            background: var(--orange-primary);
            border-radius: 50% 30% 60% 40%;
            opacity: 0.08;
            pointer-events: none;
            animation: float 8s ease-in-out infinite;
        }

        .orange-dot {
            position: absolute;
            width: 6px;
            height: 6px;
            background: var(--orange-secondary);
            border-radius: 50%;
            opacity: 0.7;
        }

        .form-container {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .form-container:hover {
            border-color: var(--orange-primary);
            box-shadow: 0 0 30px rgba(255, 107, 53, 0.1);
        }

        .input-field {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .input-field:focus {
            border-color: var(--orange-primary);
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
            outline: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--orange-primary), var(--orange-tertiary));
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 107, 53, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--orange-primary);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-15px) rotate(3deg); }
            66% { transform: translateY(8px) rotate(-2deg); }
        }

        .success-message {
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid rgba(76, 175, 80, 0.3);
            color: #4caf50;
        }

        .error-message {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid rgba(244, 67, 54, 0.3);
            color: #f44336;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <!-- Decorative elements -->
    <div class="orange-splat w-32 h-32 top-20 left-10"></div>
    <div class="orange-splat w-24 h-24 bottom-32 right-16"></div>
    <div class="orange-dot top-1/4 left-1/4"></div>
    <div class="orange-dot bottom-1/3 right-1/3"></div>

    <div class="w-full max-w-md relative z-10">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="flex items-center justify-center space-x-2 mb-4">
                <div class="w-10 h-10 bg-gradient-to-br from-orange-400 to-orange-600 rounded-lg"></div>
                <span class="text-2xl font-bold">RecruitPro</span>
            </div>
            <h1 class="text-3xl font-bold mb-2">Welcome Back</h1>
            <p class="text-gray-400">Sign in to your account to continue</p>
        </div>

        <!-- Login Form -->
        <div class="form-container p-8 rounded-xl mb-6">
            <form id="loginForm" class="space-y-6">
                <!-- Alert Messages -->
                <div id="alertMessage" class="hidden p-4 rounded-lg text-sm"></div>

                <!-- Email Field -->
                <div>
                    <label for="email" class="block text-sm font-medium mb-2">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        class="input-field w-full px-4 py-3 rounded-lg text-white placeholder-gray-400"
                        placeholder="Enter your email"
                    >
                    <div class="orange-dot absolute top-2 right-2"></div>
                </div>

                <!-- Password Field -->
                <div>
                    <label for="password" class="block text-sm font-medium mb-2">Password</label>
                    <div class="relative">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            class="input-field w-full px-4 py-3 pr-12 rounded-lg text-white placeholder-gray-400"
                            placeholder="Enter your password"
                        >
                        <button
                            type="button"
                            id="togglePassword"
                            class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-white"
                        >
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="flex items-center justify-between">
                    <label class="flex items-center">
                        <input type="checkbox" id="remember" class="mr-2 rounded border-gray-600 text-orange-500 focus:ring-orange-500">
                        <span class="text-sm text-gray-300">Remember me</span>
                    </label>
                    <a href="#" class="text-sm text-orange-400 hover:text-orange-300">Forgot password?</a>
                </div>

                <!-- Submit Button -->
                <button
                    type="submit"
                    id="submitBtn"
                    class="btn-primary w-full py-3 rounded-lg text-white font-semibold flex items-center justify-center"
                >
                    <span id="buttonText">Sign In</span>
                    <span id="loadingSpinner" class="loading-spinner hidden ml-2"></span>
                </button>
            </form>
        </div>

        <!-- Sign Up Link -->
        <div class="text-center">
            <p class="text-gray-400">
                Don't have an account?
                <a href="signup.html" class="text-orange-400 hover:text-orange-300 font-semibold">Sign up</a>
            </p>
        </div>

        <!-- Demo Credentials -->
        <div class="mt-8 p-4 bg-gray-900 rounded-lg">
            <h3 class="text-sm font-semibold mb-2 text-gray-300">Demo Credentials</h3>
            <p class="text-xs text-gray-400 mb-1">Email: demo@recruitpro.com</p>
            <p class="text-xs text-gray-400">Password: demo123456</p>
        </div>
    </div>

    <script>
        // Password visibility toggle
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('svg');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"></path>';
            } else {
                passwordInput.type = 'password';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>';
            }
        });

        // Form submission
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const buttonText = document.getElementById('buttonText');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const alertMessage = document.getElementById('alertMessage');

            // Show loading state
            submitBtn.disabled = true;
            buttonText.textContent = 'Signing In...';
            loadingSpinner.classList.remove('hidden');

            // Hide previous alerts
            alertMessage.classList.add('hidden');

            const formData = new FormData(this);
            const loginData = {
                email: formData.get('email'),
                password: formData.get('password'),
                remember: formData.get('remember') === 'on'
            };

            try {
                // Validate inputs
                if (!loginData.email || !loginData.password) {
                    throw new Error('Please fill in all fields');
                }

                // Simulate API call - replace with actual authentication
                await new Promise(resolve => setTimeout(resolve, 2000));

                // Demo authentication logic
                if (loginData.email === 'demo@recruitpro.com' && loginData.password === 'demo123456') {
                    // Create user session
                    const userSession = {
                        id: 'user_demo_001',
                        email: loginData.email,
                        firstName: 'John',
                        lastName: 'Doe',
                        company: 'TechCorp Inc.',
                        planTier: 'pro',
                        loginTime: new Date().toISOString(),
                        remember: loginData.remember
                    };

                    // Store session in localStorage
                    localStorage.setItem('recruitPro_session', JSON.stringify(userSession));

                    // Success
                    alertMessage.textContent = 'Login successful! Redirecting to dashboard...';
                    alertMessage.classList.remove('hidden', 'error-message');
                    alertMessage.classList.add('success-message');

                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                } else {
                    throw new Error('Invalid email or password');
                }

            } catch (error) {
                // Error
                alertMessage.textContent = error.message || 'Login failed. Please try again.';
                alertMessage.classList.remove('hidden', 'success-message');
                alertMessage.classList.add('error-message');

                // Reset button
                submitBtn.disabled = false;
                buttonText.textContent = 'Sign In';
                loadingSpinner.classList.add('hidden');
            }
        });

        // Floating animation for decorative elements
        document.addEventListener('DOMContentLoaded', function() {
            const splats = document.querySelectorAll('.orange-splat');
            const dots = document.querySelectorAll('.orange-dot');

            splats.forEach((splat, index) => {
                splat.style.animationDelay = `${index * 0.5}s`;
            });

            dots.forEach((dot, index) => {
                dot.style.animationDelay = `${index * 0.3}s`;
                dot.style.animation = 'float 6s ease-in-out infinite';
            });
        });
    </script>
</body>
</html>
